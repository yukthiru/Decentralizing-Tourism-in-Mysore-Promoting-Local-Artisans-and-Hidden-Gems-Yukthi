{% extends 'base.html' %}

{% block content %}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<section class="container fade-in" style="margin-top: 100px;">
    <h1 class="section-title">Hidden Gems Map</h1>
    <p style="text-align: center; margin-bottom: 2rem;">Discover artisan workshops, street food spots, and heritage ruins.</p>
    
    <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
        <!-- Sidebar Filters -->
        <div style="flex: 1; min-width: 250px; background: var(--cream); padding: 2rem; border-radius: 8px; height: fit-content;">
            <h3>Categories</h3>
            <div id="map-filters" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem;">
                <label><input type="checkbox" value="Heritage" checked> Heritage</label>
                <label><input type="checkbox" value="Nature" checked> Nature</label>
                <label><input type="checkbox" value="Food" checked> Food</label>
                <label><input type="checkbox" value="Spiritual" checked> Spiritual</label>
                <label><input type="checkbox" value="Art" checked> Art</label>
                <label><input type="checkbox" value="Artisan Workshop" checked> Artisan Workshop</label>
            </div>
        </div>

        <!-- Map Container -->
        <div id="gems-map" class="map-container" style="flex: 3; min-width: 300px;"></div>
    </div>

    <!-- Gems Grid -->
    <h2 class="section-title" style="margin-top: 4rem;">All Locations</h2>
    <div class="card-grid" id="all-gems-grid">
        <p>Loading...</p>
    </div>
</section>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if(typeof initGemsMap === 'function') initGemsMap();
    });
</script>
{% endblock %}
