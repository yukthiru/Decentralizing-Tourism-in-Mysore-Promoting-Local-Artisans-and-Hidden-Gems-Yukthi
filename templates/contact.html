{% extends 'base.html' %}

{% block content %}
<section class="contact-section container fade-in" style="margin-top: 100px;">
    <h1 class="section-title">Contact Us</h1>
    <p style="text-align: center; margin-bottom: 3rem; max-width: 800px; margin-inline: auto;">
        Have questions or suggestions for hidden gems? Or perhaps you know an artisan who should be featured? We'd love to hear from you.
    </p>

    <!-- --- CONTACT FORM --- -->
    <div class="contact-container fade-in">
        <form id="contact-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="Enter your name">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your email">
            </div>
            
            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" class="form-control" required placeholder="How can we help you?"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">Send Message</button>
            
            <!-- Message container for JS feedback -->
            <div id="form-message"></div>
        </form>
    </div>
</section>
{% endblock %}
